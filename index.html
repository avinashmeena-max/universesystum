<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Bee 🐝 | Welcome to the Ultimate Free Education Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 18%, #20170a 0%, #0c0a07 40%, #030303 90%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 50px;
      position: relative;
    }

    /* Floating notification bell */
    .top-action-bar {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 100;
    }

    .bell-circle {
      position: relative;
      background: #11100e;
      border: 1.5px solid #362e1e;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #facc15;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
    }

    .bell-count {
      position: absolute;
      top: -2px;
      right: -2px;
      background: #ef4444;
      color: #ffffff;
      font-size: 11px;
      font-family: sans-serif;
      font-weight: 700;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #0c0a07;
    }

    /* Header & Branding */
    header {
      text-align: center;
      margin-top: 14px;
      margin-bottom: 26px;
    }

    .bee-avatar {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: radial-gradient(circle, #fde047 25%, #d97706 80%);
      border: 3px solid #1c1810;
      box-shadow: 0 0 35px rgba(234, 179, 8, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      margin: 0 auto 16px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      font-weight: 700;
      line-height: 1.2;
      color: #ffffff;
    }

    .sub-tagline {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 14.5px;
      color: #d1cfc7;
      margin-top: 8px;
    }

    .sub-tagline span {
      color: #f59e0b;
      font-weight: 700;
      font-style: normal;
    }

    /* 2-Column Grid matching the viewport */
    .grid-board {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 440px;
    }

    .tile-card {
      background: #09090b;
      border: 1px solid #1a1a1e;
      border-radius: 28px;
      padding: 24px 10px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .tile-card:hover {
      transform: translateY(-2px);
      border-color: #2b271f;
    }

    /* Outer glowing squircle frame */
    .golden-squircle {
      position: relative;
      width: 86px;
      height: 86px;
      border-radius: 26px;
      border: 2px solid #eab308;
      box-shadow: 0 0 16px rgba(234, 179, 8, 0.3), inset 0 0 8px rgba(0, 0, 0, 0.9);
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .badge-bee {
      position: absolute;
      top: -6px;
      right: -6px;
      font-size: 19px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
    }

    .squircle-inner {
      width: 100%;
      height: 100%;
      border-radius: 23px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Tile title text */
    .tile-title {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      letter-spacing: 0.3px;
    }

    .gold-accent {
      color: #facc15 !important;
    }

    footer {
      margin-top: 36px;
      text-align: center;
      font-size: 11px;
      color: #6b7280;
      letter-spacing: 0.5px;
    }
  </style>
</head>
