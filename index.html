<!-- Signup / Login Modal -->
<div id="authModal" class="auth-modal">
  <div class="auth-box">
    <div class="auth-header">
      <h3>VERIFY MOBILE <span>OTP</span></h3>
      <button class="close-auth" onclick="closeAuthModal()">&times;</button>
    </div>

    <!-- Step 1: Mobile Number Input -->
    <div id="step-phone">
      <label>Enter 10-Digit Mobile Number</label>
      <div class="input-wrap">
        <span class="prefix">+91</span>
        <input type="tel" id="userPhone" placeholder="9876543210" maxlength="10">
      </div>
      <button class="auth-btn" onclick="requestOTP()">Send OTP</button>
    </div>

    <!-- Step 2: OTP Verification Box (Hidden pehle se) -->
    <div id="step-otp" style="display: none;">
      <p class="otp-sent-text">OTP sent to: <b id="displayPhone"></b></p>
      <label>Enter 6-Digit OTP</label>
      <input type="text" id="userOTP" placeholder="Enter OTP" maxlength="6" class="otp-input">
      <button class="auth-btn" onclick="verifyOTP()">Verify & Login</button>
      <button class="resend-btn" onclick="resetSteps()">Change Number</button>
    </div>

    <div id="authStatus" class="auth-status"></div>
  </div>
</div>

<style>
  /* Modal Background */
  .auth-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(10px);
    z-index: 100000;
    align-items: center;
    justify-content: center;
  }
  .auth-modal.open {
    display: flex;
  }
  .auth-box {
    background: #14141c;
    border: 2px solid #FF0000;
    border-radius: 18px;
    padding: 25px;
    width: 90%;
    max-width: 380px;
    box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
    color: #fff;
    text-align: center;
  }
  .auth-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 10px;
  }
  .auth-header h3 {
    font-size: 1.1rem;
    color: #fff;
  }
  .auth-header span {
    color: #FF0000;
  }
  .close-auth {
    background: none;
    border: none;
    color: #fff;
    font-size: 1.5rem;
    cursor: pointer;
  }
  .input-wrap {
    display: flex;
    align-items: center;
    background: #09090d;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 10px;
    margin: 10px 0 18px;
    padding: 0 12px;
  }
  .prefix {
    color: #FF0000;
    font-weight: 700;
    margin-right: 8px;
  }
  .input-wrap input, .otp-input {
    width: 100%;
    background: transparent;
    border: none;
    padding: 12px;
    color: #fff;
    font-size: 1.05rem;
    outline: none;
  }
  .otp-input {
    background: #09090d;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 10px;
    margin: 10px 0 18px;
    text-align: center;
    letter-spacing: 5px;
    font-weight: 700;
  }
  .auth-btn {
    width: 100%;
    background: #FF0000;
    border: none;
    color: #fff;
    padding: 12px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
    transition: background 0.2s;
  }
  .auth-btn:hover {
    background: #cc0000;
  }
  .resend-btn {
    background: none;
    border: none;
    color: #8e8e93;
    font-size: 0.85rem;
    margin-top: 10px;
    cursor: pointer;
    text-decoration: underline;
  }
  .otp-sent-text {
    font-size: 0.9rem;
    color: #8e8e93;
    margin-bottom: 12px;
  }
  .auth-status {
    margin-top: 15px;
    font-size: 0.9rem;
    font-weight: 600;
  }
</style>

<script>
  let serverOTP = null; // Backend ya service se aane wala actual code

  function openAuthModal() {
    document.getElementById('authModal').classList.add('open');
    resetSteps();
  }

  function closeAuthModal() {
    document.getElementById('authModal').classList.remove('open');
  }

  function resetSteps() {
    document.getElementById('step-phone').style.display = 'block';
    document.getElementById('step-otp').style.display = 'none';
    document.getElementById('authStatus').innerText = '';
    document.getElementById('userPhone').value = '';
    document.getElementById('userOTP').value = '';
  }

  function requestOTP() {
    const phone = document.getElementById('userPhone').value.trim();
    const status = document.getElementById('authStatus');

    if (phone.length !== 10 || isNaN(phone)) {
      status.style.color = '#FF0000';
      status.innerText = 'Kripya sahi 10-digit number dalein!';
      return;
    }

    // Demo/Testing ke liye random 6 digit code
    serverOTP = Math.floor(100000 + Math.random() * 900000);

    // Screen change karke OTP box dikhana
    document.getElementById('step-phone').style.display = 'none';
    document.getElementById('step-otp').style.display = 'block';
    document.getElementById('displayPhone').innerText = '+91 ' + phone;

    // Real system me yaha Firebase/SMS gateway call hoti hai
    alert('Testing ke liye aapka OTP hai: ' + serverOTP);
    status.style.color = '#00ff88';
    status.innerText = 'OTP bhej diya gaya hai!';
  }

  function verifyOTP() {
    const enteredOTP = document.getElementById('userOTP').value.trim();
    const status = document.getElementById('authStatus');

    // Strict Verification check
    if (enteredOTP === String(serverOTP)) {
      status.style.color = '#00ff88';
      status.innerText = 'OTP Verified! Login successful.';
      
      // User ko login mark karna
      localStorage.setItem('userLoggedIn', 'true');

      setTimeout(() => {
        closeAuthModal();
        alert('Welcome! Ab aap study material access kar sakte hain.');
      }, 1000);
    } else {
      status.style.color = '#FF0000';
      status.innerText = 'Galat OTP! Kripya dobara check karein.';
    }
  }
</script>
