<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Portal - Backend Integrated</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #0e0d0c;
      --card-bg: #191714;
      --card-border: #2e2820;
      --accent-orange: #ff7300;
      --text-main: #f5f0e6;
      --text-muted: #a89f91;
      --tag-green: #2ecc71;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 80px; }

    header {
      position: sticky; top: 0; z-index: 100; background: rgba(14, 13, 12, 0.95);
      border-bottom: 1px solid var(--card-border); padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .logo { font-weight: 800; font-size: 1.1rem; }
    .logo span { color: var(--accent-orange); }
    .search-box { flex: 1; max-width: 450px; }
    .search-box input {
      width: 100%; background: #1f1b15; border: 1px solid var(--card-border);
      color: var(--text-main); padding: 8px 16px; border-radius: 20px; outline: none;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

    /* PDF Viewer Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 200; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 12px; width: 100%; max-width: 900px; height: 85vh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header {
      padding: 14px 20px; border-bottom: 1px solid var(--card-border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }
    .modal-body { flex: 1; background: #222; }
    .modal-body iframe { width: 100%; height: 100%; border: none; }

    /* Cards */
    .section-title { font-size: 1.25rem; margin: 24px 0 14px; display: flex; align-items: center; gap: 8px; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .card {
      background-color: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .card-meta { font-size: 0.8rem; color: var(--text-muted); margin: 8px 0 16px; }
    .card-actions { display: flex; justify-content: space-between; align-items: center; }
    .btn-action {
      background: var(--accent-orange); color: white; border: none; padding: 6px 14px;
      border-radius: 6px; font-weight: 600; cursor: pointer; text-decoration: none;
    }
    .progress-bar { background: #2a251e; height: 4px; border-radius: 2px; overflow: hidden; margin-top: 8px; }
    .progress-fill { background: var(--accent-orange); height: 100%; width: 0%; transition: width 0.3s; }
  </style>
</head>
<body>

  <header>
    <div class="logo">STUDY WITH <span>ABHI</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search handwritten notes, PYQs, batches..." />
    </div>
  </header>

  <main class="container">
    <h2 class="section-title">Continue Learning & Batches</h2>
    <div class="cards-grid" id="materialsGrid"></div>
  </main>

  <!-- Embedded PDF Viewer Modal -->
  <div class="modal-overlay" id="pdfModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="pdfTitle">Document Preview</h3>
        <button class="modal-close" onclick="closePdf()">&times;</button>
      </div>
      <div class="modal-body">
        <iframe id="pdfFrame" src=""></iframe>
      </div>
    </div>
  </div>

  <script>
    // 1. Supabase Initialization Setup
    // Replace with your project credentials from supabase.com -> Settings -> API
    const SUPABASE_URL = "https://your-project.supabase.co";
    const SUPABASE_ANON_KEY = "your-anon-key";
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // Fallback static data if Supabase keys aren't configured yet
    const localCourses = [
      {
        id: "c1",
        title: "Class 01 full form COMPUTER",
        category: "General Resources › History",
        pdf_url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf",
        progress: 45
      },
      {
        id: "c2",
        title: "Computer 1000 MCQ Bank",
        category: "General Resources › Practice",
        pdf_url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf",
        progress: 10
      },
      {
        id: "c3",
        title: "SSC CGL / CHSL Target Batch",
        category: "Government Exams",
        pdf_url: "",
        progress: 75
      }
    ];

    // 2. Fetch from Supabase Table or Local Fallback
    async function fetchMaterials() {
      let data = localCourses;
      if (supabase && SUPABASE_URL !== "https://your-project.supabase.co") {
        const { data: dbData, error } = await supabase.from("materials").select("*");
        if (!error && dbData) data = dbData;
      }
      return data;
    }

    // 3. Render Cards
    async function loadGrid(search = "") {
      const grid = document.getElementById("materialsGrid");
      const items = await fetchMaterials();
      
      const filtered = items.filter(item => 
        item.title.toLowerCase().includes(search.toLowerCase()) ||
        item.category.toLowerCase().includes(search.toLowerCase())
      );

      grid.innerHTML = filtered.map(item => `
        <div class="card">
          <div>
            <h3>${item.title}</h3>
            <p class="card-meta">${item.category}</p>
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${item.progress || 0}%"></div>
            </div>
          </div>
          <div class="card-actions" style="margin-top: 14px;">
            <span style="font-size: 0.8rem; color: var(--tag-green);">${item.progress || 0}% Complete</span>
            <button class="btn-action" onclick="openResource('${item.id}', '${item.title}', '${item.pdf_url}')">
              ${item.pdf_url ? "Read PDF" : "Resume"}
            </button>
          </div>
        </div>
      `).join("");
    }

    // 4. PDF Viewer & Progress Tracking
    function openResource(id, title, url) {
      if (url) {
        document.getElementById("pdfTitle").innerText = title;
        document.getElementById("pdfFrame").src = url;
        document.getElementById("pdfModal").classList.add("active");
        trackProgress(id);
      } else {
        alert("Navigating to course module: " + title);
      }
    }

    function closePdf() {
      document.getElementById("pdfModal").classList.remove("active");
      document.getElementById("pdfFrame").src = "";
    }

    async function trackProgress(id) {
      if (supabase && SUPABASE_URL !== "https://your-project.supabase.co") {
        await supabase.from("user_progress").upsert({ material_id: id, last_read: new Date() });
      }
    }

    // 5. Search Listener
    document.getElementById("searchInput").addEventListener("input", (e) => {
      loadGrid(e.target.value);
    });

    // Initial Load
    loadGrid();
  </script>
</body>
</html>
