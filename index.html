<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SYSTUM - UNIVERSE | Study Hub</title>
  
  <!-- Orbitron & Rajdhani Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --primary: #FF0000;
      --primary-glow: rgba(255, 0, 0, 0.6);
      --bg-dark: #08080a;
      --bg-card: rgba(18, 18, 24, 0.78);
      --text-main: #FFFFFF;
      --text-muted: #a5a5b8;
      --border-glass: rgba(255, 255, 255, 0.12);
      --liquid-glass: rgba(14, 14, 20, 0.68);
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      font-size: 18px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3, h4 {
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* ========================================================
       1. AUTO-CLOSING INTRO OVERLAY (SYSTUM - UNIVERSE)
       ======================================================== */
    #intro-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #260000 0%, #050508 85%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999999;
      animation: autoDismissIntro 0.8s 2.3s forwards ease-in-out;
    }

    @keyframes autoDismissIntro {
      0% {
        opacity: 1;
        visibility: visible;
        transform: scale(1);
      }
      99% {
        opacity: 0;
        visibility: visible;
        transform: scale(1.08);
      }
      100% {
        opacity: 0;
        visibility: hidden;
        display: none !important;
        pointer-events: none !important;
      }
    }

    .intro-content {
      text-align: center;
      padding: 0 20px;
    }

    .intro-title {
      font-size: clamp(2.2rem, 7vw, 5.2rem);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 6px;
      margin-bottom: 12px;
      animation: pulseTitle 1.5s infinite alternate ease-in-out;
      filter: drop-shadow(0 0 25px rgba(255, 0, 0, 0.4));
    }

    .intro-title span {
      color: var(--primary);
      text-shadow: 0 0 25px var(--primary), 0 0 50px var(--primary-glow);
    }

    .intro-subtitle {
      font-size: clamp(0.85rem, 2vw, 1.2rem);
      letter-spacing: 4px;
      color: var(--text-muted);
      margin-bottom: 25px;
      font-weight: 600;
    }

    .cyber-loader {
      width: 260px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
    }

    .cyber-loader-bar {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #990000, #FF0000, #ff6666);
      box-shadow: 0 0 15px var(--primary);
      animation: loadBar 2.1s forwards cubic-bezier(0.65, 0, 0.35, 1);
    }

    @keyframes pulseTitle {
      0% { transform: scale(0.97); filter: drop-shadow(0 0 15px rgba(255,0,0,0.3)); }
      100% { transform: scale(1.02); filter: drop-shadow(0 0 35px rgba(255,0,0,0.8)); }
    }

    @keyframes loadBar {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    /* ========================================================
       2. LIQUID GLASS NAVBAR + 3-DOT MENU
       ======================================================== */
    .navbar {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 1200px;
      height: 72px;
      background: var(--liquid-glass);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      z-index: 1000;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .nav-logo {
      font-size: 1.3rem;
      font-weight: 900;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-logo span {
      color: var(--primary);
      text-shadow: 0 0 12px var(--primary);
    }

    .nav-menu {
      display: flex;
      list-style: none;
      gap: 25px;
      align-items: center;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: var(--transition);
      position: relative;
    }

    .nav-link:hover {
      color: #fff;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0%;
      height: 2px;
      background: var(--primary);
      transition: var(--transition);
      box-shadow: 0 0 10px var(--primary);
    }

    .nav-link:hover::after {
      width: 100%;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* 3-DOTS ACTION MENU WITH SOCIALS & AUTH */
    .dots-wrapper {
      position: relative;
    }

    .dots-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      color: #fff;
      font-size: 1.1rem;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .dots-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary);
    }

    .dots-dropdown {
      position: absolute;
      top: 52px;
      right: 0;
      background: rgba(14, 14, 20, 0.98);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(25px);
      border-radius: 14px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.85);
      width: 210px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 1001;
    }

    .dots-dropdown.show {
      display: flex;
    }

    .dropdown-divider {
      height: 1px;
      background: var(--border-glass);
      margin: 4px 0;
    }

    .dropdown-header {
      padding: 10px 16px 4px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .dropdown-item {
      padding: 12px 18px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
      text-decoration: none;
      transition: var(--transition);
      font-family: 'Rajdhani', sans-serif;
    }

    .dropdown-item i {
      font-size: 1.1rem;
      width: 20px;
      text-align: center;
    }

    .dropdown-item:hover {
      background: var(--primary);
      color: #fff;
    }

    .hamburger {
      display: none;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
    }

    /* ========================================================
       3. HERO SECTION (90VH)
       ======================================================== */
    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 130px 20px 40px;
      position: relative;
      background: radial-gradient(circle at 50% 30%, rgba(255, 0, 0, 0.12) 0%, rgba(8, 8, 10, 0) 70%);
    }

    .hero-box {
      max-width: 880px;
      z-index: 2;
    }

    .badge {
      display: inline-block;
      padding: 6px 18px;
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid var(--primary);
      color: var(--primary);
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 22px;
      text-transform: uppercase;
    }

    .hero-title {
      font-size: clamp(2.3rem, 5.5vw, 4.2rem);
      margin-bottom: 20px;
      font-weight: 900;
      line-height: 1.2;
    }

    .hero-title span {
      color: var(--primary);
      text-shadow: 0 0 25px var(--primary-glow);
    }

    .hero-desc {
      color: var(--text-muted);
      font-size: clamp(1rem, 2vw, 1.25rem);
      margin-bottom: 35px;
      max-width: 700px;
      margin-inline: auto;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 1px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: var(--transition);
      border: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 0 25px var(--primary-glow);
    }

    .btn-primary:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 0 35px rgba(255, 0, 0, 0.85);
    }

    .btn-glass {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(12px);
    }

    .btn-glass:hover {
      transform: translateY(-3px) scale(1.03);
      border-color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    /* ========================================================
       4. STUDY MATERIAL VAULT
       ======================================================== */
    .section-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 20px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 50px;
    }

    .section-title h2 {
      font-size: clamp(1.8rem, 3.5vw, 2.4rem);
      margin-bottom: 8px;
    }

    .section-title span {
      color: var(--primary);
    }

    .materials-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .material-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      padding: 30px;
      backdrop-filter: blur(16px);
      transition: var(--transition);
    }

    .material-card:hover {
      transform: translateY(-8px);
      border-color: var(--primary);
      box-shadow: 0 10px 30px rgba(255, 0, 0, 0.2);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(255, 0, 0, 0.12);
      border: 1px solid rgba(255, 0, 0, 0.4);
      color: #ff7777;
      font-size: 0.75rem;
      border-radius: 12px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .card-icon {
      font-size: 2.2rem;
      color: var(--primary);
      margin-bottom: 18px;
    }

    .material-card h3 {
      font-size: 1.25rem;
      margin-bottom: 12px;
    }

    .material-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 22px;
    }

    /* ========================================================
       5. YOUTUBE RSS FEED
       ======================================================== */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
    }

    .video-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(14px);
      transition: var(--transition);
    }

    .video-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--primary);
      box-shadow: 0 12px 30px rgba(255, 0, 0, 0.25);
    }

    .video-thumb-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
    }

    .video-thumb-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-details {
      padding: 20px;
    }

    .video-details h3 {
      font-size: 1rem;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
    }

    /* ========================================================
       6. ADMIN BIO SECTION
       ======================================================== */
    .bio-container {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 45px;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 40px;
      align-items: center;
      backdrop-filter: blur(16px);
    }

    .bio-profile {
      text-align: center;
      border-right: 1px solid var(--border-glass);
      padding-right: 30px;
    }

    .bio-avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 3px solid var(--primary);
      box-shadow: 0 0 25px var(--primary-glow);
      object-fit: cover;
      margin-bottom: 15px;
    }

    .bio-profile h3 {
      font-size: 1.3rem;
      margin-bottom: 6px;
    }

    .insta-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 1rem;
    }

    .insta-link:hover {
      text-shadow: 0 0 10px var(--primary);
    }

    .systum-tagline {
      font-size: 1.3rem;
      color: #fff;
      font-weight: 700;
      margin-bottom: 15px;
      background: rgba(255, 0, 0, 0.1);
      display: inline-block;
      padding: 8px 18px;
      border-radius: 8px;
      border-left: 3px solid var(--primary);
    }

    /* ========================================================
       7. CONTACT SECTION & EMAIL DIRECT LINK
       ======================================================== */
    .contact-card {
      max-width: 650px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      padding: 35px;
      border-radius: 20px;
      backdrop-filter: blur(16px);
    }

    .direct-email-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glass);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 25px;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      transition: var(--transition);
    }

    .direct-email-badge:hover {
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary-glow);
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 14px 16px;
      background: rgba(10, 10, 14, 0.85);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: var(--transition);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary-glow);
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border-glass);
      background: rgba(8, 8, 12, 0.95);
      padding: 40px 20px;
      text-align: center;
    }

    .social-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      transition: var(--transition);
    }

    .social-btn:hover {
      background: var(--primary);
      box-shadow: 0 0 15px var(--primary);
      transform: translateY(-4px);
    }

    @media (max-width: 900px) {
      .bio-container {
        grid-template-columns: 1fr;
        padding: 30px;
      }
      .bio-profile {
        border-right: none;
        border-bottom: 1px solid var(--border-glass);
        padding-right: 0;
        padding-bottom: 25px;
      }
    }

    @media (max-width: 768px) {
      .hamburger {
        display: block;
      }
      .nav-menu {
        position: absolute;
        top: 85px;
        left: 0;
        width: 100%;
        background: rgba(14, 14, 20, 0.98);
        border: 1px solid var(--border-glass);
        border-radius: 16px;
        flex-direction: column;
        padding: 25px;
        display: none;
      }
      .nav-menu.active {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <!-- 1. AUTO-FADING CINEMATIC INTRO SCREEN (2.3s) -->
  <div id="intro-screen">
    <div class="intro-content">
      <h1 class="intro-title">SYSTUM - <span>UNIVERSE</span></h1>
      <p class="intro-subtitle">INITIALIZING QUANTUM STUDY ENGINE</p>
      <div class="cyber-loader">
        <div class="cyber-loader-bar"></div>
      </div>
    </div>
  </div>

  <!-- 2. FIXED LIQUID GLASS NAVBAR -->
  <header>
    <nav class="navbar">
      <a href="#home" class="nav-logo">
        <i class="fa-solid fa-atom" style="color:var(--primary)"></i> SYSTUM<span>.</span>
      </a>

      <!-- Menu links -->
      <ul class="nav-menu" id="nav-menu">
        <li><a href="#home" class="nav-link">Home</a></li>
        <li><a href="#materials" class="nav-link">Study Material</a></li>
        <li><a href="#videos" class="nav-link">Lectures</a></li>
        <li><a href="#about" class="nav-link">Admin Bio</a></li>
        <li><a href="#contact" class="nav-link">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <!-- 3-DOTS MENU WITH INSTAGRAM, YOUTUBE, LOGIN/LOGOUT -->
        <div class="dots-wrapper">
          <button class="dots-btn" id="dotsToggle" title="Options">
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </button>
          
          <div class="dots-dropdown" id="dotsDropdown">
            <div class="dropdown-header">Social Media</div>
            <!-- Instagram Link -->
            <a href="https://instagram.com/_avinash_meenaa" target="_blank" class="dropdown-item">
              <i class="fa-brands fa-instagram" style="color:#E1306C;"></i> Instagram
            </a>
            <!-- YouTube Channel Link -->
            <a href="https://youtube.com/@xnaviff" target="_blank" class="dropdown-item">
              <i class="fa-brands fa-youtube" style="color:#FF0000;"></i> xn avi ff
            </a>

            <div class="dropdown-divider"></div>
            <div class="dropdown-header">Account</div>

            <!-- Login / Logout Optio
